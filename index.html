<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার করুন</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            color: var(--text);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        input, select {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
            background-color: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .success {
            background-color: #dcfce7;
            color: #166534;
            display: block !important;
        }

        .error {
            background-color: #fee2e2;
            color: #991b1b;
            display: block !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>অর্ডার করুন</h1>
    <p class="subtitle">অর্ডার করতে নিচের ফর্মটি পূরণ করুন</p>

    <form id="orderForm">
        <div class="form-group">
            <label for="customer_name">আপনার নাম</label>
            <input type="text" id="customer_name" name="customer_name" required placeholder="আপনার পূর্ণ নাম লিখুন">
        </div>
        <div class="form-group">
            <label for="phone">মোবাইল নম্বর</label>
            <input type="tel" id="phone" name="phone" required placeholder="০১৭xxxxxxxx">
        </div>
        <div class="form-group">
            <label for="address">পূর্ণাঙ্গ ঠিকানা</label>
            <input type="text" id="address" name="address" required placeholder="গ্রাম/রাস্তা, থানা, জেলা">
        </div>
        <button type="submit">অর্ডার নিশ্চিত করুন</button>
    </form>

    <div id="message"></div>
</div>

<script>
    const form = document.getElementById('orderForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = {
            customer_name: document.getElementById('customer_name').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
        };

        try {
            const response = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (result.success) {
                messageDiv.textContent = 'আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে!';
                messageDiv.className = 'success';
                form.reset();
            } else {
                messageDiv.textContent = result.message || 'একটি সমস্যা occurred।';
                messageDiv.className = 'error';
            }
        } catch (error) {
            messageDiv.textContent = 'সার্ভারের সাথে সংযোগ করা যাচ্ছে না।';
                messageDiv.className = 'error';
        }
    });
</script>

</body>
</html>
