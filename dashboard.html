<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Dashboard</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #111827;
            --border: #d1d5db;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { color: var(--text); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid var(--border); text-align: left; }
        th { background: #f9fafb; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input, select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; }
        button { padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { opacity: 0.9; }
        .status-pending { color: orange; font-weight: bold; }
        .status-approved { color: green; font-weight: bold; }
        .nav { margin-bottom: 20px; display: flex; gap: 10px; }
        .nav a { text-decoration: none; color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/dashboard">Orders</a>
            <a href="/dashboard/products">Products</a>
            <a href="/logout">Logout</a>
        </div>

        <div id="mainContent">
            <!-- Content loaded via JS -->
        </div>
    </div>

    <script>
        async function api(method, endpoint, body = null) {
            const res = await fetch(endpoint, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : null
            });
            if (res.status === 401) {
                window.location.href = '/login';
                return;
            }
            return res.json();
        }

        async function loadOrders() {
            const data = await api('GET', '/api/dashboard/orders');
            const content = document.getElementById('mainContent');
            if (!data || !data.success) return;

            let html = `<h2>Pending Orders</h2><div class="card"><table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Delivery</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>`;

            data.orders.forEach(order => {
                html += `
                <tr>
                    <td>${order.customer_name}</td>
                    <td>${order.phone}</td>
                    <td>${order.address}</td>
                    <td>
                        <select id="prod_${order.id}">
                            <option value="">Select Product</option>
                            ${data.products.map(p => `<option value="${p.name}|${p.price}" ${order.product_name === p.name ? 'selected' : ''}>${p.name} (৳${p.price})</option>`).join('')}
                        </select>
                    </td>
                    <td><input type="number" id="price_${order.id}" value="${order.price || ''}"></td>
                    <td><input type="number" id="delivery_${order.id}" value="0"></td>
                    <td><button onclick="approveOrder(${order.id})">Approve & Send</button></td>
                </tr>`;
            });

            html += `</tbody></table></div>`;
            content.innerHTML = html;
        }

        async function approveOrder(id) {
            const productVal = document.getElementById('prod_' + id).value;
            if (!productVal) return alert('Please select a product');
            const [product_name, price] = productVal.split('|');
            const delivery_charge = document.getElementById('delivery_' + id).value;

            const res = await api('POST', '/api/dashboard/approve', {
                id,
                product_name,
                price,
                delivery_charge
            });

            if (res.success) {
                alert('Order approved and dispatched!');
                loadOrders();
            } else {
                alert('Error: ' + res.message);
            }
        }

        async function loadProducts() {
            const data = await api('GET', '/api/dashboard/products');
            const content = document.getElementById('mainContent');
            if (!data || !data.success) return;

            let html = `<h2>Product Management</h2>
            <div class="card">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="p_name">
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="number" id="p_price">
                </div>
                <button onclick="saveProduct()">Add Product</button>
            </div>
            <div class="card">
                <table>
                    <thead><tr><th>Name</th><th>Price</th><th>Action</th></tr></thead>
                    <tbody>
                        ${data.products.map(p => `<tr><td>${p.name}</td><td>৳${p.price}</td><td><button onclick="deleteProduct('${p.id}')" style="background:red">Delete</button></td></tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
            content.innerHTML = html;
        }

        async function saveProduct() {
            const name = document.getElementById('p_name').value;
            const price = document.getElementById('p_price').value;
            if (!name || !price) return alert('Fill all fields');

            const res = await api('POST', '/api/dashboard/products', { name, price: Number(price) });
            if (res.success) {
                loadProducts();
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            const res = await api('DELETE', '/api/dashboard/products/' + id);
            if (res.success) loadProducts();
        }

        window.approveOrder = approveOrder;
        window.saveProduct = saveProduct;
        window.deleteProduct = deleteProduct;

        const path = window.location.pathname;
        if (path === '/dashboard' || path === '/dashboard/') loadOrders();
        else if (path === '/dashboard/products') loadProducts();
    </script>
</body>
</html>
